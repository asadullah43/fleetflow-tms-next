# Translates grpc-web (what the browser/Next.js app speaks) into native
# gRPC (what the Node backend speaks). The browser can't call gRPC
# directly — this proxy is the standard way around that.
#
# Frontend calls http://localhost:8080 (this proxy) instead of the
# backend's gRPC port directly.
#
# CORS: only the origins in CORS_ALLOWED_ORIGINS (comma-separated, e.g.
# "https://fleet.example.com") may call this from a browser page on
# another origin. envoy/render-config.sh writes them in at start-up, in
# place of the #@CORS_ALLOWED_ORIGINS@ line below; started without it,
# no other origin is allowed at all. In production the browser reaches
# Envoy through nginx on the app's own origin, so CORS is not even
# involved there; the list matters for local development, where the
# Next.js dev server (http://localhost:3000) calls Envoy directly.
static_resources:
  listeners:
    - name: listener_grpc_web
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_grpc_web
                codec_type: AUTO
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        # File upload / download is plain HTTP, served by the backend on its own port.
                        - match: { prefix: "/files/" }
                          route:
                            cluster: files_backend
                            timeout: 300s
                        - match: { path: "/files" }
                          route:
                            cluster: files_backend
                            timeout: 300s
                        - match: { prefix: "/" }
                          route:
                            cluster: grpc_backend
                            timeout: 60s
                      typed_per_filter_config:
                        envoy.filters.http.cors:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                          #@CORS_ALLOWED_ORIGINS@
                          # grpc-web is POST; files are GET (download) and POST (upload, link).
                          allow_methods: GET, POST, OPTIONS
                          allow_headers: keep-alive,user-agent,cache-control,content-type,content-transfer-encoding,x-accept-content-transfer-encoding,x-accept-response-streaming,x-user-agent,x-grpc-web,grpc-timeout,authorization,x-api-key,idempotency-key,x-request-id
                          max_age: "86400"
                          expose_headers: grpc-status,grpc-message
                http_filters:
                  - name: envoy.filters.http.grpc_web
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: grpc_backend
      connect_timeout: 5s
      type: LOGICAL_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: grpc_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      # "backend" = the docker-compose service name
                      address: backend
                      port_value: 50051

    - name: files_backend
      connect_timeout: 5s
      type: LOGICAL_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: files_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: backend
                      port_value: 8081

# Admin interface (config dump, /quitquitquit, ...) is reachable from inside the container only.
admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }
