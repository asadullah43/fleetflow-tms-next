# ═══════════════════════════════════════════════════════════
# FleetFlow-TMS-Next Reverse Proxy - Nginx
# Routes: /grpc/* → Envoy (grpc-web -> backend gRPC), /* → Next.js
# ═══════════════════════════════════════════════════════════

upstream nextjs_app {
    server frontend:3000;
}

upstream envoy_grpc_web {
    server envoy:8080;
}

server {
    listen 80;
    server_name localhost;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # ── grpc-web traffic (frontend -> Envoy -> backend) ───
    # grpc-web needs HTTP/1.1 keep-alive with chunked bodies passed through
    # untouched — no buffering, no gzip on this path.
    location /grpc/ {
        rewrite ^/grpc/(.*)$ /$1 break;
        proxy_pass http://envoy_grpc_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── File upload / download (Envoy -> backend's HTTP file endpoint) ───
    # Same route as grpc-web, with a body limit that fits the largest
    # upload (backend FILE_UPLOAD_MAX_BYTES, 10 MB) plus multipart framing.
    location /grpc/files {
        rewrite ^/grpc/(.*)$ /$1 break;
        proxy_pass http://envoy_grpc_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 12M;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ── Next.js app (SSR + static assets) ─────────────────
    location / {
        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Security Headers ──────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Request Size Limit ────────────────────────────────
    client_max_body_size 10M;
}
