syntax = "proto3";

package fleetflow.users;

import "common.proto";

service UsersService {
  rpc List(ListRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: UserList
  rpc Get(IdRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: User
  rpc Create(CreateUserRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: User
  rpc Update(UpdateUserRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: User
  rpc Delete(IdRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: fleetflow.common.Empty
}

message ListRequest {
  int32 page = 1;        // 1-based; default 1
  int32 page_size = 2;   // default 20, max 100
  string search = 3;     // server-side, case-insensitive partial match
  string sort_by = 4;    // one of the service's sortable fields
  string sort_order = 5; // asc | desc
  map<string, string> filters = 6; // service-specific exact/range filters
}
message IdRequest { int32 id = 1; }

// Never carries passwordHash — SAFE_FIELDS-style projection, same as legacy.
message User {
  int32 id = 1;
  string name = 2;
  string email = 3;
  optional string username = 4;
  string role = 5;
  optional int32 role_id = 6;
  string language = 7;
  string status = 8;
  optional string role_name = 9; // denormalized from roleRef
}

message UserList {
  repeated User items = 1;
  fleetflow.common.Pagination pagination = 100;
}

message CreateUserRequest {
  string name = 1;
  string email = 2;
  optional string username = 3;
  string password = 4;
  optional string role = 5;
  optional int32 role_id = 6;
  optional string language = 7;
  optional string status = 8;
}

message UpdateUserRequest {
  int32 id = 1;
  optional string name = 2;
  optional string email = 3;
  optional string username = 4;
  optional string password = 5; // set to change password; omitted to leave unchanged
  optional string role = 6;
  optional int32 role_id = 7;
  optional string language = 8;
  optional string status = 9;
}
