syntax = "proto3";

package fleetflow.users;

service UsersService {
  rpc List(ListRequest) returns (UserList);
  rpc Get(IdRequest) returns (User);
  rpc Create(CreateUserRequest) returns (User);
  rpc Update(UpdateUserRequest) returns (User);
  rpc Delete(IdRequest) returns (DeleteResponse);
}

message ListRequest {}
message IdRequest { int32 id = 1; }
message DeleteResponse {}

// Never carries passwordHash — SAFE_FIELDS-style projection, same as legacy.
message User {
  int32 id = 1;
  string name = 2;
  string email = 3;
  optional string username = 4;
  string role = 5;
  optional int32 role_id = 6;
  string language = 7;
  string status = 8;
  optional string role_name = 9; // denormalized from roleRef
}

message UserList { repeated User items = 1; }

message CreateUserRequest {
  string name = 1;
  string email = 2;
  optional string username = 3;
  string password = 4;
  optional string role = 5;
  optional int32 role_id = 6;
  optional string language = 7;
  optional string status = 8;
}

message UpdateUserRequest {
  int32 id = 1;
  optional string name = 2;
  optional string email = 3;
  optional string username = 4;
  optional string password = 5; // set to change password; omitted to leave unchanged
  optional string role = 6;
  optional int32 role_id = 7;
  optional string language = 8;
  optional string status = 9;
}
