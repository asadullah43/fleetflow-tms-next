syntax = "proto3";

package fleetflow.workshop;

import "common.proto";

message ListRequest {
  int32 page = 1;        // 1-based; default 1
  int32 page_size = 2;   // default 20, max 100
  string search = 3;     // server-side, case-insensitive partial match
  string sort_by = 4;    // one of the service's sortable fields
  string sort_order = 5; // asc | desc
  map<string, string> filters = 6; // service-specific exact/range filters
}
message IdRequest { int32 id = 1; }

// ---- Work orders ----
service WorkOrdersService {
  rpc List(ListRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: WorkOrderList
  rpc Get(IdRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: WorkOrder
  rpc Create(CreateWorkOrderRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: WorkOrder
  rpc Update(UpdateWorkOrderRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: WorkOrder
  rpc Delete(IdRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: fleetflow.common.Empty
}

message WorkOrder {
  int32 id = 1;
  string order_number = 2;
  int32 truck_id = 3;
  optional int32 driver_id = 4;
  optional int32 supplier_id = 5;
  string issue = 6;
  optional string diagnosis = 7;
  optional string description = 8;
  string priority = 9;
  string status = 10;
  optional string start_date = 11;
  optional string completion_date = 12;
  optional string odometer = 13;
  string labor_cost = 14;
  string parts_cost = 15;
  string other_cost = 16;
  string total_cost = 17;
  optional string notes = 18;
  optional string truck_number = 19;
  optional string driver_name = 20;
  optional string driver_name_ar = 21;
}
message WorkOrderList {
  repeated WorkOrder items = 1;
  fleetflow.common.Pagination pagination = 100;
}
message CreateWorkOrderRequest {
  int32 truck_id = 1;
  optional int32 driver_id = 2;
  optional int32 supplier_id = 3;
  string issue = 4;
  optional string diagnosis = 5;
  optional string description = 6;
  optional string priority = 7;
  optional string status = 8;
  optional string start_date = 9;
  optional string completion_date = 10;
  optional string odometer = 11;
  optional string labor_cost = 12;
  optional string parts_cost = 13;
  optional string other_cost = 14;
  optional string notes = 15;
  // Inventory used, taken from stock as the order is created (all lines or none); added to the parts cost.
  repeated WorkOrderPartLine parts = 16;
}
// One inventory line: an item, the warehouse it is taken from, how many.
message WorkOrderPartLine {
  int32 item_id = 1;
  int32 warehouse_id = 2;
  int32 quantity = 3;
}
message UpdateWorkOrderRequest {
  int32 id = 1;
  optional int32 truck_id = 2;
  optional int32 driver_id = 3;
  optional int32 supplier_id = 4;
  optional string issue = 5;
  optional string diagnosis = 6;
  optional string description = 7;
  optional string priority = 8;
  optional string status = 9;
  optional string start_date = 10;
  optional string completion_date = 11;
  optional string odometer = 12;
  optional string labor_cost = 13;
  optional string parts_cost = 14;
  optional string other_cost = 15;
  optional string notes = 16;
}

// ---- Maintenance schedules ----
service MaintenanceSchedulesService {
  rpc List(ListRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: MaintenanceScheduleList
  rpc Get(IdRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: MaintenanceSchedule
  rpc Create(CreateMaintenanceScheduleRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: MaintenanceSchedule
  rpc Update(UpdateMaintenanceScheduleRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: MaintenanceSchedule
  rpc Delete(IdRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: fleetflow.common.Empty
}

message MaintenanceSchedule {
  int32 id = 1;
  int32 truck_id = 2;
  string maintenance_type = 3;
  optional string description = 4;
  optional string mileage_interval = 5;
  optional int32 day_interval = 6;
  optional string last_service = 7;
  optional string next_service = 8;
  string status = 9;
  optional string notes = 10;
  optional string truck_number = 11;
}
message MaintenanceScheduleList {
  repeated MaintenanceSchedule items = 1;
  fleetflow.common.Pagination pagination = 100;
}
message CreateMaintenanceScheduleRequest {
  int32 truck_id = 1;
  string maintenance_type = 2;
  optional string description = 3;
  optional string mileage_interval = 4;
  optional int32 day_interval = 5;
  optional string last_service = 6;
  optional string next_service = 7;
  optional string status = 8;
  optional string notes = 9;
}
message UpdateMaintenanceScheduleRequest {
  int32 id = 1;
  optional int32 truck_id = 2;
  optional string maintenance_type = 3;
  optional string description = 4;
  optional string mileage_interval = 5;
  optional int32 day_interval = 6;
  optional string last_service = 7;
  optional string next_service = 8;
  optional string status = 9;
  optional string notes = 10;
}

// ---- Vehicle inspections ----
service VehicleInspectionsService {
  rpc List(ListRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: VehicleInspectionList
  rpc Get(IdRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: VehicleInspection
  rpc Create(CreateVehicleInspectionRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: VehicleInspection
  rpc Update(UpdateVehicleInspectionRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: VehicleInspection
  rpc Delete(IdRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: fleetflow.common.Empty
}

message VehicleInspection {
  int32 id = 1;
  int32 truck_id = 2;
  int32 inspector_id = 3;
  string inspect_date = 4;
  optional string odometer = 5;
  optional string notes = 6;
  string result = 7;
  optional string attachments = 8;
  optional string truck_number = 9;
  optional string inspector_name = 10;
}
message VehicleInspectionList {
  repeated VehicleInspection items = 1;
  fleetflow.common.Pagination pagination = 100;
}
message CreateVehicleInspectionRequest {
  int32 truck_id = 1;
  int32 inspector_id = 2;
  string inspect_date = 3;
  optional string odometer = 4;
  optional string notes = 5;
  optional string result = 6;
  optional string attachments = 7;
}
message UpdateVehicleInspectionRequest {
  int32 id = 1;
  optional int32 truck_id = 2;
  optional int32 inspector_id = 3;
  optional string inspect_date = 4;
  optional string odometer = 5;
  optional string notes = 6;
  optional string result = 7;
  optional string attachments = 8;
}

// ---- Workshop expenses ----
service WorkshopExpensesService {
  rpc List(ListRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: WorkshopExpenseList
  rpc Get(IdRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: WorkshopExpense
  rpc Create(CreateWorkshopExpenseRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: WorkshopExpense
  rpc Update(UpdateWorkshopExpenseRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: WorkshopExpense
  rpc Delete(IdRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: fleetflow.common.Empty
}

message WorkshopExpense {
  int32 id = 1;
  int32 truck_id = 2;
  optional int32 work_order_id = 3;
  string category = 4;
  string amount = 5;
  optional string description = 6;
  string expense_date = 7;
  optional string truck_number = 8;
}
message WorkshopExpenseList {
  repeated WorkshopExpense items = 1;
  fleetflow.common.Pagination pagination = 100;
}
message CreateWorkshopExpenseRequest {
  int32 truck_id = 1;
  optional int32 work_order_id = 2;
  string category = 3;
  string amount = 4;
  optional string description = 5;
  optional string expense_date = 6;
}
message UpdateWorkshopExpenseRequest {
  int32 id = 1;
  optional int32 truck_id = 2;
  optional int32 work_order_id = 3;
  optional string category = 4;
  optional string amount = 5;
  optional string description = 6;
  optional string expense_date = 7;
}

// ---- Work order parts: inventory used on a work order ----
// Each line draws from one warehouse, is valued at the item's unit cost at the
// time, and adds to the work order's parts cost. Lines are added or removed
// (removing returns the stock to its warehouse), never edited.
service WorkOrderPartsService {
  rpc List(ListRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: WorkOrderPartList
  rpc Create(CreateWorkOrderPartRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: WorkOrderPart
  rpc Delete(IdRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: fleetflow.common.Empty
}

message WorkOrderPart {
  int32 id = 1;
  int32 work_order_id = 2;
  int32 item_id = 3;
  int32 warehouse_id = 4;
  int32 quantity = 5;
  string unit_cost = 6;
  string total_cost = 7;
  optional string item_name = 8;
  optional string item_name_ar = 9;
  optional string item_number = 10;
  optional string warehouse_name = 11;
  optional string warehouse_name_ar = 12;
  optional string created_at = 13;
}
message WorkOrderPartList {
  repeated WorkOrderPart items = 1;
  fleetflow.common.Pagination pagination = 100;
}
message CreateWorkOrderPartRequest {
  int32 work_order_id = 1;
  int32 item_id = 2;
  int32 warehouse_id = 3; // which warehouse the stock is taken from
  int32 quantity = 4;
}

// ---- Inspection checklist items ----
service InspectionItemsService {
  rpc List(ListRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: InspectionItemList
  rpc Create(CreateInspectionItemRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: InspectionItem
  rpc Update(UpdateInspectionItemRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: InspectionItem
  rpc Delete(IdRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: fleetflow.common.Empty
}

message InspectionItem {
  int32 id = 1;
  int32 inspection_id = 2;
  optional int32 work_order_id = 3;
  string checklist_item = 4;
  string status = 5;
  optional string defect = 6;
}
message InspectionItemList {
  repeated InspectionItem items = 1;
  fleetflow.common.Pagination pagination = 100;
}
message CreateInspectionItemRequest {
  int32 inspection_id = 1;
  optional int32 work_order_id = 2;
  string checklist_item = 3;
  optional string status = 4;
  optional string defect = 5;
}
message UpdateInspectionItemRequest {
  int32 id = 1;
  optional string status = 2;
  optional string defect = 3;
}
