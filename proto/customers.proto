syntax = "proto3";

package fleetflow.customers;

import "common.proto";

service CustomersService {
  rpc List(ListRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: CustomerList
  rpc Get(IdRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: Customer
  rpc Create(CreateCustomerRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: Customer
  rpc Update(UpdateCustomerRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: Customer
  rpc Delete(IdRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: fleetflow.common.Empty
}

message ListRequest {
  int32 page = 1;        // 1-based; default 1
  int32 page_size = 2;   // default 20, max 100
  string search = 3;     // server-side, case-insensitive partial match
  string sort_by = 4;    // one of the service's sortable fields
  string sort_order = 5; // asc | desc
  map<string, string> filters = 6; // service-specific exact/range filters
}
message IdRequest { int32 id = 1; }

message Customer {
  int32 id = 1;
  string name = 2;
  optional string name_ar = 3;
  optional string contact_person = 4;
  optional string phone = 5;
  optional string email = 6;
  optional string address = 7;
  optional string vat_number = 8;
  optional string cr_number = 9;
  optional string street_name = 10;
  optional string building_number = 11;
  optional string postal_code = 12;
  optional string city = 13;
  optional string country = 14;
  string status = 15;
}

message CustomerList {
  repeated Customer items = 1;
  fleetflow.common.Pagination pagination = 100;
}

message CreateCustomerRequest {
  string name = 1;
  optional string language = 2;
  optional string contact_person = 3;
  optional string phone = 4;
  optional string email = 5;
  optional string address = 6;
  optional string vat_number = 7;
  optional string cr_number = 8;
  optional string street_name = 9;
  optional string building_number = 10;
  optional string postal_code = 11;
  optional string city = 12;
  optional string country = 13;
  optional string status = 14;
  // Arabic value entered alongside the English one (preferred over the legacy `language` tag).
  optional string name_ar = 50;
}

message UpdateCustomerRequest {
  int32 id = 1;
  optional string name = 2;
  optional string language = 3;
  optional string contact_person = 4;
  optional string phone = 5;
  optional string email = 6;
  optional string address = 7;
  optional string vat_number = 8;
  optional string cr_number = 9;
  optional string street_name = 10;
  optional string building_number = 11;
  optional string postal_code = 12;
  optional string city = 13;
  optional string country = 14;
  optional string status = 15;
  // Arabic value entered alongside the English one (preferred over the legacy `language` tag).
  optional string name_ar = 50;
}
