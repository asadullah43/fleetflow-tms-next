syntax = "proto3";

package fleetflow.customers;

service CustomersService {
  rpc List(ListRequest) returns (CustomerList);
  rpc Get(IdRequest) returns (Customer);
  rpc Create(CreateCustomerRequest) returns (Customer);
  rpc Update(UpdateCustomerRequest) returns (Customer);
  rpc Delete(IdRequest) returns (DeleteResponse);
}

message ListRequest {}
message IdRequest { int32 id = 1; }
message DeleteResponse {}

message Customer {
  int32 id = 1;
  string name = 2;
  optional string name_ar = 3;
  optional string contact_person = 4;
  optional string phone = 5;
  optional string email = 6;
  optional string address = 7;
  optional string vat_number = 8;
  optional string cr_number = 9;
  optional string street_name = 10;
  optional string building_number = 11;
  optional string postal_code = 12;
  optional string city = 13;
  optional string country = 14;
  string status = 15;
}

message CustomerList { repeated Customer items = 1; }

message CreateCustomerRequest {
  string name = 1;
  optional string language = 2;
  optional string contact_person = 3;
  optional string phone = 4;
  optional string email = 5;
  optional string address = 6;
  optional string vat_number = 7;
  optional string cr_number = 8;
  optional string street_name = 9;
  optional string building_number = 10;
  optional string postal_code = 11;
  optional string city = 12;
  optional string country = 13;
  optional string status = 14;
}

message UpdateCustomerRequest {
  int32 id = 1;
  optional string name = 2;
  optional string language = 3;
  optional string contact_person = 4;
  optional string phone = 5;
  optional string email = 6;
  optional string address = 7;
  optional string vat_number = 8;
  optional string cr_number = 9;
  optional string street_name = 10;
  optional string building_number = 11;
  optional string postal_code = 12;
  optional string city = 13;
  optional string country = 14;
  optional string status = 15;
}
