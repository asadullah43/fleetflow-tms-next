syntax = "proto3";

package fleetflow.trips;

import "common.proto";

service TripsService {
  rpc List(ListRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: TripList
  rpc Get(IdRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: Trip
  rpc Create(CreateTripRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: Trip
  rpc Update(UpdateTripRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: Trip
  rpc Delete(IdRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: fleetflow.common.Empty
}

message ListRequest {
  int32 page = 1;        // 1-based; default 1
  int32 page_size = 2;   // default 20, max 100
  string search = 3;     // server-side, case-insensitive partial match
  string sort_by = 4;    // one of the service's sortable fields
  string sort_order = 5; // asc | desc
  map<string, string> filters = 6; // service-specific exact/range filters
}
message IdRequest { int32 id = 1; }

message Trip {
  int32 id = 1;
  string transaction_number = 2;
  optional int32 supplier_id = 3;
  optional int32 customer_id = 4;
  int32 pickup_location_id = 5;
  int32 delivery_location_id = 6;
  int32 cargo_type_id = 7;
  string quantity = 8;
  string trip_date = 9;
  int32 truck_id = 10;
  optional int32 driver_id = 11;
  optional int32 invoice_id = 12;   // set from the invoice side (Invoices: trip); never written through the trips API
  optional string invoice_number = 13;

  // Denormalized for display, resolved server-side via Prisma include.
  optional string supplier_name = 20;
  optional string customer_name = 21;
  optional string pickup_location_name = 22;
  optional string delivery_location_name = 23;
  optional string cargo_type_name = 24;
  optional string truck_number = 25;
  optional string driver_name = 26;

  optional string supplier_name_ar = 30;
  optional string customer_name_ar = 31;
  optional string pickup_location_name_ar = 32;
  optional string delivery_location_name_ar = 33;
  optional string cargo_type_name_ar = 34;
  optional string driver_name_ar = 35;
}

message TripList {
  repeated Trip items = 1;
  fleetflow.common.Pagination pagination = 100;
}

message CreateTripRequest {
  string transaction_number = 1;
  optional int32 supplier_id = 2;
  optional int32 customer_id = 3;
  int32 pickup_location_id = 4;
  int32 delivery_location_id = 5;
  int32 cargo_type_id = 6;
  string quantity = 7;
  string trip_date = 8;
  int32 truck_id = 9;
  optional int32 driver_id = 10;
}

message UpdateTripRequest {
  int32 id = 1;
  optional string transaction_number = 2;
  optional int32 supplier_id = 3;
  optional int32 customer_id = 4;
  optional int32 pickup_location_id = 5;
  optional int32 delivery_location_id = 6;
  optional int32 cargo_type_id = 7;
  optional string quantity = 8;
  optional string trip_date = 9;
  optional int32 truck_id = 10;
  optional int32 driver_id = 11;
}
