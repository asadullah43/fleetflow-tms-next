syntax = "proto3";

package fleetflow.auth;

import "common.proto";

// Login is public; the other three act on the signed-in user (JWT only —
// an API key has no user profile).
service AuthService {
  rpc Login(LoginRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: LoginResponse
  rpc GetMe(GetMeRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: UserProfile
  rpc UpdateLanguage(UpdateLanguageRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: UserProfile
  rpc GetMyPermissions(GetMeRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: PermissionList
}

message LoginRequest {
  string username = 1;
  string password = 2;
  optional string language = 3;
}

message LoginResponse {
  string access_token = 1;
  UserProfile user = 2;
  // When the session ends (ISO 8601). The backend rejects the token after
  // this moment; the frontend uses it to sign the user out on time.
  string expires_at = 3;
}

// GetMe / GetMyPermissions take no body fields — the caller identity comes
// from the "authorization: Bearer <jwt>" metadata.
message GetMeRequest {}

message UpdateLanguageRequest {
  string language = 1;
}

message UserProfile {
  int32 id = 1;
  string name = 2;
  string email = 3;
  optional string role = 4;
  optional int32 role_id = 5;
  string language = 6;
  int32 company_id = 7;
  string company_name = 8;
}

message Permission {
  string module = 1;
  bool can_view = 2;
  bool can_add = 3;
  bool can_edit = 4;
  bool can_delete = 5;
}

message PermissionList {
  repeated Permission permissions = 1;
}
