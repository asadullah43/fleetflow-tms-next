syntax = "proto3";

package fleetflow.trucks;

import "common.proto";

service TrucksService {
  rpc List(ListRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: TruckList
  rpc Get(IdRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: Truck
  rpc Create(CreateTruckRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: Truck
  rpc Update(UpdateTruckRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: Truck
  rpc Delete(IdRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: fleetflow.common.Empty
}

message ListRequest {
  int32 page = 1;        // 1-based; default 1
  int32 page_size = 2;   // default 20, max 100
  string search = 3;     // server-side, case-insensitive partial match
  string sort_by = 4;    // one of the service's sortable fields
  string sort_order = 5; // asc | desc
  map<string, string> filters = 6; // service-specific exact/range filters
}
message IdRequest { int32 id = 1; }

message Truck {
  int32 id = 1;
  string truck_number = 2;
  optional string truck_type = 3;
  string status = 4;
}

message TruckList {
  repeated Truck items = 1;
  fleetflow.common.Pagination pagination = 100;
}

message CreateTruckRequest {
  string truck_number = 1;
  optional string truck_type = 2;
  optional string status = 3;
}

message UpdateTruckRequest {
  int32 id = 1;
  optional string truck_number = 2;
  optional string truck_type = 3;
  optional string status = 4;
}
