syntax = "proto3";

package fleetflow.locations;

service LocationsService {
  rpc List(ListRequest) returns (LocationList);
  rpc Get(IdRequest) returns (Location);
  rpc Create(CreateLocationRequest) returns (Location);
  rpc Update(UpdateLocationRequest) returns (Location);
  rpc Delete(IdRequest) returns (DeleteResponse);
}

message ListRequest {}
message IdRequest { int32 id = 1; }
message DeleteResponse {}

message Location {
  int32 id = 1;
  string name = 2;
  optional string name_ar = 3;
  optional string description = 4;
  optional string description_ar = 5;
  string status = 6;
}

message LocationList { repeated Location items = 1; }

message CreateLocationRequest {
  string name = 1;
  optional string language = 2;
  optional string description = 3;
  optional string status = 4;
}

message UpdateLocationRequest {
  int32 id = 1;
  optional string name = 2;
  optional string language = 3;
  optional string description = 4;
  optional string status = 5;
}
