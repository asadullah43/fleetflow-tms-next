syntax = "proto3";

package fleetflow.hr;

import "common.proto";

message ListRequest {
  int32 page = 1;        // 1-based; default 1
  int32 page_size = 2;   // default 20, max 100
  string search = 3;     // server-side, case-insensitive partial match
  string sort_by = 4;    // one of the service's sortable fields
  string sort_order = 5; // asc | desc
  map<string, string> filters = 6; // service-specific exact/range filters
}
message IdRequest { int32 id = 1; }

// ---- Departments ----
service DepartmentsService {
  rpc List(ListRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: DepartmentList
  rpc Get(IdRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: Department
  rpc Create(CreateDepartmentRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: Department
  rpc Update(UpdateDepartmentRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: Department
  rpc Delete(IdRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: fleetflow.common.Empty
}

message Department {
  int32 id = 1;
  string name = 2;
  optional string name_ar = 3;
  optional string description = 4;
  optional int32 manager_id = 5;
  string status = 6;
}
message DepartmentList {
  repeated Department items = 1;
  fleetflow.common.Pagination pagination = 100;
}
message CreateDepartmentRequest {
  string name = 1;
  optional string language = 2;
  optional string description = 3;
  optional int32 manager_id = 4;
  optional string status = 5;
  // Arabic value entered alongside the English one (preferred over the legacy `language` tag).
  optional string name_ar = 50;
}
message UpdateDepartmentRequest {
  int32 id = 1;
  optional string name = 2;
  optional string language = 3;
  optional string description = 4;
  optional int32 manager_id = 5;
  optional string status = 6;
  // Arabic value entered alongside the English one (preferred over the legacy `language` tag).
  optional string name_ar = 50;
}

