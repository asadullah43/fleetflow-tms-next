  optional int32 manager_id = 11;
  optional string salary = 12;
  optional string address = 13;
  optional string emergency_contact = 14;
  optional string emergency_phone = 15;
  optional int32 driver_id = 16;
  optional string notes = 17;
  // Arabic value entered alongside the English one (preferred over the legacy `language` tag).
  optional string name_ar = 50;
}
message UpdateEmployeeRequest {
  int32 id = 1;
  optional string name = 2;
  optional string language = 3;
  optional string email = 4;
  optional string phone = 5;
  optional string id_number = 6;
  optional string joining_date = 7;
  optional string employment_type = 8;
  optional string employment_status = 9;
  optional int32 department_id = 10;
  optional int32 designation_id = 11;
  optional int32 manager_id = 12;
  optional string salary = 13;
  optional string address = 14;
  optional string emergency_contact = 15;
  optional string emergency_phone = 16;
  optional int32 driver_id = 17;
  optional string notes = 18;
  // Arabic value entered alongside the English one (preferred over the legacy `language` tag).
