syntax = "proto3";

package fleetflow.hr;

message ListRequest {}
message IdRequest { int32 id = 1; }
message DeleteResponse {}

// ---- Departments ----
service DepartmentsService {
  rpc List(ListRequest) returns (DepartmentList);
  rpc Get(IdRequest) returns (Department);
  rpc Create(CreateDepartmentRequest) returns (Department);
  rpc Update(UpdateDepartmentRequest) returns (Department);
  rpc Delete(IdRequest) returns (DeleteResponse);
}

message Department {
  int32 id = 1;
  string name = 2;
  optional string name_ar = 3;
  optional string description = 4;
  optional int32 manager_id = 5;
  string status = 6;
}
message DepartmentList { repeated Department items = 1; }
message CreateDepartmentRequest {
  string name = 1;
  optional string language = 2;
  optional string description = 3;
  optional int32 manager_id = 4;
  optional string status = 5;
}
message UpdateDepartmentRequest {
  int32 id = 1;
  optional string name = 2;
  optional string language = 3;
  optional string description = 4;
  optional int32 manager_id = 5;
  optional string status = 6;
}

// ---- Designations ----
service DesignationsService {
  rpc List(ListRequest) returns (DesignationList);
  rpc Get(IdRequest) returns (Designation);
  rpc Create(CreateDesignationRequest) returns (Designation);
  rpc Update(UpdateDesignationRequest) returns (Designation);
  rpc Delete(IdRequest) returns (DeleteResponse);
}

message Designation {
  int32 id = 1;
  string name = 2;
  optional string name_ar = 3;
  optional string description = 4;
  int32 department_id = 5;
  optional string level = 6;
  string status = 7;
  optional string department_name = 8;
}
message DesignationList { repeated Designation items = 1; }
message CreateDesignationRequest {
  string name = 1;
  optional string language = 2;
  optional string description = 3;
  int32 department_id = 4;
  optional string level = 5;
  optional string status = 6;
}
message UpdateDesignationRequest {
  int32 id = 1;
  optional string name = 2;
  optional string language = 3;
  optional string description = 4;
  optional int32 department_id = 5;
  optional string level = 6;
  optional string status = 7;
}

// ---- Employees ----
service EmployeesService {
  rpc List(ListRequest) returns (EmployeeList);
  rpc Get(IdRequest) returns (Employee);
  rpc Create(CreateEmployeeRequest) returns (Employee);
  rpc Update(UpdateEmployeeRequest) returns (Employee);
  rpc Delete(IdRequest) returns (DeleteResponse);
}

message Employee {
  int32 id = 1;
  string employee_number = 2;
  string name = 3;
  optional string name_ar = 4;
  optional string email = 5;
  optional string phone = 6;
  optional string id_number = 7;
  string joining_date = 8;
  string employment_type = 9;
  string employment_status = 10;
  int32 department_id = 11;
  optional int32 designation_id = 12;
  optional int32 manager_id = 13;
  optional string salary = 14;
  optional string address = 15;
  optional string emergency_contact = 16;
  optional string emergency_phone = 17;
  optional int32 driver_id = 18;
  optional string notes = 19;
  optional string department_name = 30;
  optional string designation_name = 31;
}
message EmployeeList { repeated Employee items = 1; }
message CreateEmployeeRequest {
  string name = 1;
  optional string language = 2;
  optional string email = 3;
  optional string phone = 4;
  optional string id_number = 5;
  string joining_date = 6;
  optional string employment_type = 7;
  optional string employment_status = 8;
  int32 department_id = 9;
  optional int32 designation_id = 10;
  optional int32 manager_id = 11;
  optional string salary = 12;
  optional string address = 13;
  optional string emergency_contact = 14;
  optional string emergency_phone = 15;
  optional int32 driver_id = 16;
  optional string notes = 17;
}
message UpdateEmployeeRequest {
  int32 id = 1;
  optional string name = 2;
  optional string language = 3;
  optional string email = 4;
  optional string phone = 5;
  optional string id_number = 6;
  optional string joining_date = 7;
  optional string employment_type = 8;
  optional string employment_status = 9;
  optional int32 department_id = 10;
  optional int32 designation_id = 11;
  optional int32 manager_id = 12;
  optional string salary = 13;
  optional string address = 14;
  optional string emergency_contact = 15;
  optional string emergency_phone = 16;
  optional int32 driver_id = 17;
  optional string notes = 18;
}

// ---- Attendance ----
service AttendanceService {
  rpc List(ListRequest) returns (AttendanceList);
  rpc Get(IdRequest) returns (Attendance);
  rpc Create(CreateAttendanceRequest) returns (Attendance);
  rpc Update(UpdateAttendanceRequest) returns (Attendance);
  rpc Delete(IdRequest) returns (DeleteResponse);
}

message Attendance {
  int32 id = 1;
  int32 employee_id = 2;
  string attend_date = 3;
  optional string check_in = 4;
  optional string check_out = 5;
  string status = 6;
  optional string hours_worked = 7;
  optional string notes = 8;
  optional string employee_name = 9;
}
message AttendanceList { repeated Attendance items = 1; }
message CreateAttendanceRequest {
  int32 employee_id = 1;
  string attend_date = 2;
  optional string check_in = 3;
  optional string check_out = 4;
  optional string status = 5;
  optional string hours_worked = 6;
  optional string notes = 7;
}
message UpdateAttendanceRequest {
  int32 id = 1;
  optional int32 employee_id = 2;
  optional string attend_date = 3;
  optional string check_in = 4;
  optional string check_out = 5;
  optional string status = 6;
  optional string hours_worked = 7;
  optional string notes = 8;
}

// ---- Leave requests ----
service LeaveRequestsService {
  rpc List(ListRequest) returns (LeaveRequestList);
  rpc Get(IdRequest) returns (LeaveRequest);
  rpc Create(CreateLeaveRequestRequest) returns (LeaveRequest);
  rpc Update(UpdateLeaveRequestRequest) returns (LeaveRequest);
  rpc Delete(IdRequest) returns (DeleteResponse);
}

message LeaveRequest {
  int32 id = 1;
  int32 employee_id = 2;
  string leave_type = 3;
  string start_date = 4;
  string end_date = 5;
  int32 days = 6;
  optional string reason = 7;
  string status = 8;
  optional int32 approver_id = 9;
  optional string comments = 10;
  optional string employee_name = 11;
}
message LeaveRequestList { repeated LeaveRequest items = 1; }
message CreateLeaveRequestRequest {
  int32 employee_id = 1;
  string leave_type = 2;
  string start_date = 3;
  string end_date = 4;
  int32 days = 5;
  optional string reason = 6;
  optional string status = 7;
}
message UpdateLeaveRequestRequest {
  int32 id = 1;
  optional int32 employee_id = 2;
  optional string leave_type = 3;
  optional string start_date = 4;
  optional string end_date = 5;
  optional int32 days = 6;
  optional string reason = 7;
  optional string status = 8;
  optional int32 approver_id = 9;
  optional string comments = 10;
}

// ---- Employee documents ----
service EmployeeDocumentsService {
  rpc List(ListRequest) returns (EmployeeDocumentList);
  rpc Get(IdRequest) returns (EmployeeDocument);
  rpc Create(CreateEmployeeDocumentRequest) returns (EmployeeDocument);
  rpc Update(UpdateEmployeeDocumentRequest) returns (EmployeeDocument);
  rpc Delete(IdRequest) returns (DeleteResponse);
}

message EmployeeDocument {
  int32 id = 1;
  int32 employee_id = 2;
  string document_type = 3;
  optional string document_number = 4;
  optional string issue_date = 5;
  optional string expiry_date = 6;
  optional string file_url = 7;
  optional string notes = 8;
  optional string employee_name = 9;
}
message EmployeeDocumentList { repeated EmployeeDocument items = 1; }
message CreateEmployeeDocumentRequest {
  int32 employee_id = 1;
  string document_type = 2;
  optional string document_number = 3;
  optional string issue_date = 4;
  optional string expiry_date = 5;
  optional string file_url = 6;
  optional string notes = 7;
}
message UpdateEmployeeDocumentRequest {
  int32 id = 1;
  optional int32 employee_id = 2;
  optional string document_type = 3;
  optional string document_number = 4;
  optional string issue_date = 5;
  optional string expiry_date = 6;
  optional string file_url = 7;
  optional string notes = 8;
}

// ---- Employment contracts ----
service EmploymentContractsService {
  rpc List(ListRequest) returns (EmploymentContractList);
  rpc Get(IdRequest) returns (EmploymentContract);
  rpc Create(CreateEmploymentContractRequest) returns (EmploymentContract);
  rpc Update(UpdateEmploymentContractRequest) returns (EmploymentContract);
  rpc Delete(IdRequest) returns (DeleteResponse);
}

message EmploymentContract {
  int32 id = 1;
  int32 employee_id = 2;
  string contract_number = 3;
  string contract_type = 4;
  string start_date = 5;
  optional string end_date = 6;
  optional string salary = 7;
  optional string currency = 8;
  optional string terms = 9;
  string status = 10;
  optional string document_url = 11;
  optional string title = 12;
  optional string notes = 13;
  optional string employee_name = 14;
}
message EmploymentContractList { repeated EmploymentContract items = 1; }
message CreateEmploymentContractRequest {
  int32 employee_id = 1;
  string contract_number = 2;
  optional string contract_type = 3;
  string start_date = 4;
  optional string end_date = 5;
  optional string salary = 6;
  optional string currency = 7;
  optional string terms = 8;
  optional string status = 9;
  optional string document_url = 10;
  optional string title = 11;
  optional string notes = 12;
}
message UpdateEmploymentContractRequest {
  int32 id = 1;
  optional int32 employee_id = 2;
  optional string contract_number = 3;
  optional string contract_type = 4;
  optional string start_date = 5;
  optional string end_date = 6;
  optional string salary = 7;
  optional string currency = 8;
  optional string terms = 9;
  optional string status = 10;
  optional string document_url = 11;
  optional string title = 12;
  optional string notes = 13;
}
