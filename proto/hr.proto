// ---- Leave requests ----
service LeaveRequestsService {
  rpc List(ListRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: LeaveRequestList
  rpc Get(IdRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: LeaveRequest
  rpc Create(CreateLeaveRequestRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: LeaveRequest
  rpc Update(UpdateLeaveRequestRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: LeaveRequest
  rpc Delete(IdRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: fleetflow.common.Empty
}

message LeaveRequest {
  int32 id = 1;
  int32 employee_id = 2;
  string leave_type = 3;
  string start_date = 4;
  string end_date = 5;
  int32 days = 6;
  optional string reason = 7;
  string status = 8;
  optional int32 approver_id = 9;
  optional string comments = 10;
  optional string employee_name = 11;
}
message LeaveRequestList {
  repeated LeaveRequest items = 1;
  fleetflow.common.Pagination pagination = 100;
}
message CreateLeaveRequestRequest {
  int32 employee_id = 1;
  string leave_type = 2;
  string start_date = 3;
  string end_date = 4;
  int32 days = 5;
  optional string reason = 6;
  optional string status = 7;
}
message UpdateLeaveRequestRequest {
  int32 id = 1;
  optional int32 employee_id = 2;
  optional string leave_type = 3;
  optional string start_date = 4;
  optional string end_date = 5;
  optional int32 days = 6;
  optional string reason = 7;
  optional string status = 8;
  optional int32 approver_id = 9;
  optional string comments = 10;
}

// ---- Employee documents ----
service EmployeeDocumentsService {
  rpc List(ListRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: EmployeeDocumentList
  rpc Get(IdRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: EmployeeDocument
  rpc Create(CreateEmployeeDocumentRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: EmployeeDocument
  rpc Update(UpdateEmployeeDocumentRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: EmployeeDocument
  rpc Delete(IdRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: fleetflow.common.Empty
}

message EmployeeDocument {
  int32 id = 1;
  int32 employee_id = 2;
  string document_type = 3;
  optional string document_number = 4;
  optional string issue_date = 5;
  optional string expiry_date = 6;
  optional string file_url = 7; // /files/{file_id} for an uploaded file (older records may hold a typed-in link)
  optional string notes = 8;
  optional string employee_name = 9;
  optional int32 file_id = 10;
  optional fleetflow.common.FileInfo file = 11;
}
message EmployeeDocumentList {
  repeated EmployeeDocument items = 1;
  fleetflow.common.Pagination pagination = 100;
}
message CreateEmployeeDocumentRequest {
  int32 employee_id = 1;
  string document_type = 2;
  optional string document_number = 3;
  optional string issue_date = 4;
  optional string expiry_date = 5;
  reserved 6; // was file_url: the file is now uploaded (POST /files) and attached by file_id
  optional string notes = 7;
  optional int32 file_id = 8; // from POST /files?purpose=EMPLOYEE_DOCUMENT
}
message UpdateEmployeeDocumentRequest {
  int32 id = 1;
  optional int32 employee_id = 2;
  optional string document_type = 3;
  optional string document_number = 4;
  optional string issue_date = 5;
  optional string expiry_date = 6;
  reserved 7; // was file_url
  optional string notes = 8;
  optional int32 file_id = 9; // a new upload replaces the current file; 0 removes it
}

// ---- Employment contracts ----
service EmploymentContractsService {
  rpc List(ListRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: EmploymentContractList
  rpc Get(IdRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: EmploymentContract
  rpc Create(CreateEmploymentContractRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: EmploymentContract
  rpc Update(UpdateEmploymentContractRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: EmploymentContract
  rpc Delete(IdRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: fleetflow.common.Empty
}

message EmploymentContract {
  int32 id = 1;
  int32 employee_id = 2;
  string contract_number = 3;
  string contract_type = 4;
  string start_date = 5;
  optional string end_date = 6;
  optional string salary = 7;
  optional string currency = 8;
  optional string terms = 9;
  string status = 10;
  optional string document_url = 11; // /files/{document_file_id}, set by the server
  optional string title = 12;
  optional string notes = 13;
  optional string employee_name = 14;
  optional int32 document_file_id = 15;
  optional fleetflow.common.FileInfo document_file = 16;
  optional string document_uploaded_at = 17; // set by the server from the upload
  optional string document_uploaded_by = 18;
}
message EmploymentContractList {
  repeated EmploymentContract items = 1;
  fleetflow.common.Pagination pagination = 100;
}
message CreateEmploymentContractRequest {
  int32 employee_id = 1;
  string contract_number = 2;
  optional string contract_type = 3;
  string start_date = 4;
  optional string end_date = 5;
  optional string salary = 6;
  optional string currency = 7;
  optional string terms = 8;
  optional string status = 9;
  reserved 10; // was document_url: set by the server from document_file_id
  optional string title = 11;
  optional string notes = 12;
  optional int32 document_file_id = 13; // from POST /files?purpose=CONTRACT_DOCUMENT
}
message UpdateEmploymentContractRequest {
  int32 id = 1;
  optional int32 employee_id = 2;
  optional string contract_number = 3;
  optional string contract_type = 4;
  optional string start_date = 5;
  optional string end_date = 6;
  optional string salary = 7;
  optional string currency = 8;
  optional string terms = 9;
  optional string status = 10;
  reserved 11; // was document_url
  optional string title = 12;
  optional string notes = 13;
  optional int32 document_file_id = 14; // a new upload replaces the current document; 0 removes it
}
