syntax = "proto3";

package fleetflow.supplierpayments;

import "common.proto";

service SupplierPaymentsService {
  rpc List(ListRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: SupplierPaymentList
  rpc Get(IdRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: SupplierPayment
  rpc Create(CreateSupplierPaymentRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: SupplierPayment
  rpc Update(UpdateSupplierPaymentRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: SupplierPayment
  rpc Delete(IdRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: fleetflow.common.Empty
}

message ListRequest {
  int32 page = 1;        // 1-based; default 1
  int32 page_size = 2;   // default 20, max 100
  string search = 3;     // server-side, case-insensitive partial match
  string sort_by = 4;    // one of the service's sortable fields
  string sort_order = 5; // asc | desc
  map<string, string> filters = 6; // service-specific exact/range filters
}
message IdRequest { int32 id = 1; }

message SupplierPayment {
  int32 id = 1;
  int32 supplier_id = 2;
  string amount = 3;
  string currency = 4;
  string payment_date = 5;
  optional string description = 6;

  optional string supplier_name = 20;
  optional string supplier_name_ar = 21;
}

message SupplierPaymentList {
  repeated SupplierPayment items = 1;
  fleetflow.common.Pagination pagination = 100;
}

message CreateSupplierPaymentRequest {
  int32 supplier_id = 1;
  string amount = 2;
  optional string currency = 3;
  optional string payment_date = 4;
  optional string description = 5;
}

message UpdateSupplierPaymentRequest {
  int32 id = 1;
  optional int32 supplier_id = 2;
  optional string amount = 3;
  optional string currency = 4;
  optional string payment_date = 5;
  optional string description = 6;
}
