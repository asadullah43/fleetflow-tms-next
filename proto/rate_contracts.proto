syntax = "proto3";

package fleetflow.ratecontracts;

import "common.proto";

service RateContractsService {
  rpc List(ListRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: RateContractList
  rpc Get(IdRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: RateContract
  rpc Create(CreateRateContractRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: RateContract
  rpc Update(UpdateRateContractRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: RateContract
  rpc Delete(IdRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: fleetflow.common.Empty
}

message ListRequest {
  int32 page = 1;        // 1-based; default 1
  int32 page_size = 2;   // default 20, max 100
  string search = 3;     // server-side, case-insensitive partial match
  string sort_by = 4;    // one of the service's sortable fields
  string sort_order = 5; // asc | desc
  map<string, string> filters = 6; // service-specific exact/range filters
}
message IdRequest { int32 id = 1; }

message RateContract {
  int32 id = 1;
  int32 customer_id = 2;
  int32 pickup_location_id = 3;
  int32 delivery_location_id = 4;
  int32 cargo_type_id = 5;
  string rate = 6;
  string currency = 7;

  optional string customer_name = 20;
  optional string pickup_location_name = 21;
  optional string delivery_location_name = 22;
  optional string cargo_type_name = 23;

  optional string customer_name_ar = 24;
  optional string pickup_location_name_ar = 25;
  optional string delivery_location_name_ar = 26;
  optional string cargo_type_name_ar = 27;
}

message RateContractList {
  repeated RateContract items = 1;
  fleetflow.common.Pagination pagination = 100;
}

message CreateRateContractRequest {
  int32 customer_id = 1;
  int32 pickup_location_id = 2;
  int32 delivery_location_id = 3;
  int32 cargo_type_id = 4;
  string rate = 5;
  optional string currency = 6;
}

message UpdateRateContractRequest {
  int32 id = 1;
  optional int32 customer_id = 2;
  optional int32 pickup_location_id = 3;
  optional int32 delivery_location_id = 4;
  optional int32 cargo_type_id = 5;
  optional string rate = 6;
  optional string currency = 7;
}
