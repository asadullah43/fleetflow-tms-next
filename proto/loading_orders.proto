syntax = "proto3";

package fleetflow.loadingorders;

// Matches the legacy app: a "Generate Loading Order" run creates `quantity`
// individually-serialled slips (LO-0001, LO-0002, ...) sharing one batch,
// the list view shows one row per batch (serial range + quantity), and the
// only delete is "remove this whole batch" — there is no per-row edit.
service LoadingOrdersService {
  rpc ListGrouped(ListRequest) returns (LoadingOrderBatchList);
  rpc GetBatch(DeleteBatchRequest) returns (LoadingOrderList);
  rpc Create(CreateLoadingOrderRequest) returns (LoadingOrderList);
  rpc DeleteBatch(DeleteBatchRequest) returns (DeleteResponse);
}

message ListRequest {}
message DeleteResponse {}

message LoadingOrder {
  int32 id = 1;
  string serial_number = 2;
  int32 batch_id = 3;
  int32 pickup_location_id = 4;
  int32 delivery_location_id = 5;
  int32 customer_id = 6;
  int32 cargo_type_id = 7;
  string created_at = 8;

  optional string pickup_location_name = 20;
  optional string delivery_location_name = 21;
  optional string customer_name = 22;
  optional string cargo_type_name = 23;

  optional string pickup_location_name_ar = 24;
  optional string delivery_location_name_ar = 25;
  optional string customer_name_ar = 26;
  optional string cargo_type_name_ar = 27;
}

message LoadingOrderList { repeated LoadingOrder items = 1; }

message LoadingOrderBatch {
  int32 batch_id = 1;
  string first_serial_number = 2;
  string last_serial_number = 3;
  int32 quantity = 4;
  string pickup_location_name = 5;
  string delivery_location_name = 6;
  string customer_name = 7;
  string cargo_type_name = 8;
  string created_at = 9;

  optional string pickup_location_name_ar = 10;
  optional string delivery_location_name_ar = 11;
  optional string customer_name_ar = 12;
  optional string cargo_type_name_ar = 13;
}

message LoadingOrderBatchList { repeated LoadingOrderBatch items = 1; }

message CreateLoadingOrderRequest {
  int32 pickup_location_id = 1;
  int32 delivery_location_id = 2;
  int32 customer_id = 3;
  int32 cargo_type_id = 4;
  int32 quantity = 5;
}

message DeleteBatchRequest { int32 batch_id = 1; }
