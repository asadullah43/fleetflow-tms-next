syntax = "proto3";

package fleetflow.invoices;

import "common.proto";

service InvoicesService {
  rpc List(ListRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: InvoiceList
  rpc Get(IdRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: Invoice
  rpc Create(CreateInvoiceRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: Invoice
  rpc Update(UpdateInvoiceRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: Invoice
  rpc Delete(IdRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: fleetflow.common.Empty
  rpc MarkPaid(IdRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: Invoice
  // Generates the ZATCA Phase-1 QR (seller/VAT/timestamp/total/VAT TLV,
  // base64) and moves the invoice to SIGNED. Full Phase-2 cryptographic
  // stamping (CSR / compliance CSID / production CSID against ZATCA's
  // real API) needs live government-issued certificates this environment
  // has no way to obtain or test against, so it isn't wired up — see
  // CompanySettings' zatca_* onboarding fields for where that plugs in.
  rpc SubmitToZatca(IdRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: Invoice
}

message ListRequest {
  int32 page = 1;        // 1-based; default 1
  int32 page_size = 2;   // default 20, max 100
  string search = 3;     // server-side, case-insensitive partial match
  string sort_by = 4;    // one of the service's sortable fields
  string sort_order = 5; // asc | desc
  map<string, string> filters = 6; // service-specific exact/range filters
}
message IdRequest { int32 id = 1; }

message InvoiceLineItemInput {
  string description = 1;
  string quantity = 2;
  string rate = 3;
  optional string tax_category = 4;
  optional string tax_percent = 5;
}

message InvoiceLineItem {
  int32 id = 1;
  string description = 2;
  string quantity = 3;
  string rate = 4;
  string amount = 5;
  string tax_category = 6;
  string tax_percent = 7;
  string tax_amount = 8;
}

message Invoice {
  int32 id = 1;
  string invoice_number = 2;
  int32 customer_id = 3;
  string issue_date = 4;
  string due_date = 5;
  string from_date = 6;
  string to_date = 7;
  string currency = 8;
  string invoice_type = 9;
  string payment_means = 10;
  bool vat_enabled = 11;
  string vat_percent = 12;
  string subtotal = 13;
  string vat_amount = 14;
  string total = 15;
  string status = 16;
  optional string paid_at = 17;
  repeated InvoiceLineItem line_items = 18;
  optional string customer_name = 19;
  optional string customer_name_ar = 20;

  optional string zatca_status = 30;
  optional string qr_code = 31;
  optional string invoice_uuid = 32;

  // The trip this invoice is for, if one was linked (a reference: neither record changes the other).
  optional int32 trip_id = 40;
  optional string trip_transaction_number = 41;
}

message InvoiceList {
  repeated Invoice items = 1;
  fleetflow.common.Pagination pagination = 100;
}

message CreateInvoiceRequest {
  int32 customer_id = 1;
  string due_date = 2;
  string from_date = 3;
  string to_date = 4;
  optional string currency = 5;
  optional string invoice_type = 6;
  optional string payment_means = 7;
  optional bool vat_enabled = 8;
  optional string vat_percent = 9;             // 0 to 100
  repeated InvoiceLineItemInput line_items = 10;
  optional int32 trip_id = 11;                 // link the trip this invoice is for (it must not be on another invoice)
}

message UpdateInvoiceRequest {
  int32 id = 1;
  optional int32 customer_id = 2;
  optional string due_date = 3;
  optional string from_date = 4;
  optional string to_date = 5;
  optional string currency = 6;
  optional string invoice_type = 7;
  optional string payment_means = 8;
  optional bool vat_enabled = 9;
  optional string vat_percent = 10;            // 0 to 100
  optional string status = 11;
  repeated InvoiceLineItemInput line_items = 12;
  optional int32 trip_id = 13;                 // link a trip (replacing the linked one); 0 unlinks; absent leaves it
}
