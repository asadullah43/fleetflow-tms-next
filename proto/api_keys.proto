syntax = "proto3";

package fleetflow.apikeys;

import "common.proto";

// API keys let external systems call the same API as the web app, sending
// metadata `x-api-key: <key>` instead of a user session. A key belongs to
// one company, carries only the permissions granted to it, and can be
// revoked at any time. Managing keys requires a signed-in user.
service ApiKeysService {
  rpc List(ListRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: ApiKeyList
  rpc Create(CreateApiKeyRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: CreatedApiKey
  rpc Revoke(IdRequest) returns (fleetflow.common.ApiResponse); // DB_DATA: ApiKey
}

message ListRequest {
  int32 page = 1;        // 1-based; default 1
  int32 page_size = 2;   // default 20, max 100
  string search = 3;     // server-side, case-insensitive partial match
  string sort_by = 4;    // one of the service's sortable fields
  string sort_order = 5; // asc | desc
  map<string, string> filters = 6; // service-specific exact/range filters
}
message IdRequest { int32 id = 1; }

message ApiKeyScope {
  string module = 1;
  bool can_view = 2;
  bool can_add = 3;
  bool can_edit = 4;
  bool can_delete = 5;
}

message ApiKey {
  int32 id = 1;
  string name = 2;
  string key_prefix = 3; // first characters only — the full key is never stored or shown again
  string status = 4;     // ACTIVE | REVOKED
  repeated ApiKeyScope scopes = 5;
  optional string last_used_at = 6;
  optional string revoked_at = 7;
  string created_at = 8;
  optional string created_by_name = 9;
}

message ApiKeyList {
  repeated ApiKey items = 1;
  fleetflow.common.Pagination pagination = 100;
}

message CreateApiKeyRequest {
  string name = 1;
  repeated ApiKeyScope scopes = 2;
}

message CreatedApiKey {
  ApiKey api_key = 1;
  // The full key. Returned once, at creation; store it securely.
  string plaintext_key = 2;
}
