# Security headers for every response. Included in each location, because
# a location that sets any add_header of its own stops inheriting the
# server's. $fleetflow_hsts is set by the server template: the HSTS value
# over HTTPS, empty over plain HTTP (an empty header is not sent).
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security $fleetflow_hsts always;
