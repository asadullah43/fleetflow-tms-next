# The routes, the same in development (HTTP) and production (HTTPS):
# /grpc/* -> Envoy (grpc-web -> backend gRPC), /grpc/files* -> Envoy ->
# backend file endpoint, everything else -> Next.js.

gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
gzip_min_length 256;

# Default body limit; the file endpoint has its own, larger one.
client_max_body_size 10M;

# ── grpc-web traffic (frontend -> Envoy -> backend) ───
# grpc-web needs HTTP/1.1 keep-alive with chunked bodies passed through
# untouched — no buffering, no gzip on this path.
location /grpc/ {
    include /etc/nginx/snippets/fleetflow-headers.conf;
    rewrite ^/grpc/(.*)$ /$1 break;
    proxy_pass http://envoy_grpc_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# ── File upload / download (Envoy -> backend's HTTP file endpoint) ───
# A body limit that fits the largest upload (backend FILE_UPLOAD_MAX_BYTES,
# 10 MB) plus multipart framing. No CSP here: files are PDFs and images
# opened in the browser's own viewer (the backend sets their headers).
location /grpc/files {
    include /etc/nginx/snippets/fleetflow-headers.conf;
    rewrite ^/grpc/(.*)$ /$1 break;
    proxy_pass http://envoy_grpc_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 12M;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
}

# ── Next.js app (SSR + static assets) ─────────────────
location / {
    include /etc/nginx/snippets/fleetflow-headers.conf;
    # Content-Security-Policy for the app's pages. Everything is served from
    # this origin (self-hosted fonts, API under /grpc). 'unsafe-inline' for
    # scripts and styles is required by Next.js's inline hydration scripts
    # and Mantine's inline styles; removing it needs per-request nonces.
    # data:/blob: images are the company logo and generated documents.
    # No 'wasm-unsafe-eval': long.js (via protobufjs) probes for WebAssembly
    # and falls back to plain JS when it's refused — the browser console
    # shows one harmless "script-src wasm-eval" report per page load.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    proxy_pass http://nextjs_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
