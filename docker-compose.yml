# ═══════════════════════════════════════════════════════════
# FleetFlow TMS - Docker Compose
# Stack: PostgreSQL + Node gRPC backend + Envoy (grpc-web proxy)
#        + Next.js frontend + Nginx. See README.md.
# ═══════════════════════════════════════════════════════════

services:
  # ── PostgreSQL Database ──────────────────────────────────
  database:
    image: postgres:17-alpine
    container_name: fleetflow-next-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_use_strong_password}
      POSTGRES_DB: ${POSTGRES_DB:-fleetflow}
    # Published on the host's loopback only (for backups and local tooling)
    # — not on every network interface.
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fleetflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fleetflow-net

  # ── Backend gRPC service (Node/TS) ───────────────────────
  # On start it applies pending database migrations, then serves the API.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fleetflow-next-api
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      GRPC_PORT: 50051
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme_use_strong_password}@database:5432/${POSTGRES_DB:-fleetflow}?schema=public
      # Required, no default: a default secret is public (it's in this file),
      # and anyone who knows it can forge an ADMIN token. Set it in .env.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env to a long random string (see .env.example)}
      # How long a sign-in lasts. Enforced by the backend: after this the user must sign in again.
      SESSION_DURATION: ${SESSION_DURATION:-12h}
      # Only used when the database has no users yet (first start). Without it a random password is printed once in the backend log.
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    expose:
      - "50051"
    networks:
      - fleetflow-net

  # ── Envoy: grpc-web <-> native gRPC bridge ──────────────
  # Browsers can't speak raw gRPC, so the frontend calls Envoy
  # (grpc-web over HTTP/1.1 or HTTP/2) and Envoy forwards to `backend`
  # over native gRPC. See envoy/envoy.yaml.
  envoy:
    image: envoyproxy/envoy:v1.31-latest
    container_name: fleetflow-next-envoy
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    expose:
      - "8080"
    networks:
      - fleetflow-net

  # ── Frontend (Next.js) ──────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Browser-side code talks to Envoy through the nginx reverse
        # proxy's public path, not the internal docker-network name.
        NEXT_PUBLIC_GRPC_WEB_URL: ${PUBLIC_GRPC_WEB_URL:-/grpc}
    container_name: fleetflow-next-web
    restart: unless-stopped
    depends_on:
      - envoy
    expose:
      - "3000"
    networks:
      - fleetflow-net

  # ── Nginx reverse proxy ──────────────────────────────────
  # Routes /grpc/* to Envoy (grpc-web) and everything else to Next.js,
  # so the browser only ever talks to one origin.
  nginx:
    image: nginx:alpine
    container_name: fleetflow-next-proxy
    restart: unless-stopped
    depends_on:
      - frontend
      - envoy
    ports:
      - "${HTTP_PORT:-8889}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - fleetflow-net

volumes:
  database_data:
    driver: local

networks:
  fleetflow-net:
    driver: bridge
